[package]
name = "socialeye"
version = "0.1.0"
description = "SocialEye — local-first social media & content management"
authors = ["SocialEye contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "socialeye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "http2"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync", "fs"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
regex = "1"
rust_xlsxwriter = "0.79"
log = "0.4"
csv = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
