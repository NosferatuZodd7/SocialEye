# SocialEye CI: lint, types and tests on every push; then the Windows installers.
# Every push to the development branch (or main) is published as a TESTING build — GitHub pre-release
# vX.Y.Z-dev.N — that the app's "Testing" channel installs. A tag vX.Y.Z (pushed by the owner, equal to
# the version in package.json) publishes a STABLE release. Nothing is published unless the update signing
# key (secret TAURI_SIGNING_PRIVATE_KEY) and its public key (variable SOCIALEYE_UPDATER_PUBKEY) are
# configured: fail closed. See docs/UPDATES.md.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Branch whose builds are published to the Testing channel (besides main).
  DEV_BRANCH: claude/zealous-fermat-0n15a1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # generate_context! needs a built frontend directory to exist.
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # Also compile the updater path, which only exists when a public key is embedded.
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
        env: { SOCIALEYE_UPDATER_PUBKEY: ci-placeholder }
      - run: cargo test
        working-directory: src-tauri

  audit:
    name: Dependency audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
        continue-on-error: true

  # Testing: package.json version + "-dev.<run>" (next patch if that version is already released as stable).
  # Stable (tag vX.Y.Z): the tag must equal the package.json version.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      channel: ${{ steps.decide.outputs.channel }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$base" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json $base"; exit 1; fi
            echo "version=$base" >> "$GITHUB_OUTPUT"; echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/v$base" >/dev/null; then
              IFS=. read -r major minor patch <<< "$base"; base="$major.$minor.$((patch + 1))"
              echo "::notice::v$base-dev: package.json version is already released as stable, using the next patch."
            fi
            echo "version=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; echo "channel=testing" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF_NAME" = "$DEV_BRANCH" ] || [ "$GITHUB_REF_NAME" = "main" ]; }; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  windows:
    name: Windows installers (and update release)
    needs: [frontend, rust, version]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.SOCIALEYE_UPDATER_PUBKEY != '' }}
      # Baked into the binary: the key the app verifies updates with, and where it looks for them.
      SOCIALEYE_UPDATER_PUBKEY: ${{ vars.SOCIALEYE_UPDATER_PUBKEY }}
      SOCIALEYE_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      - name: Stamp version
        shell: bash
        run: |
          # MSI versions must be numeric, so test builds ship the NSIS installer (which the updater uses) only.
          if [ "$CHANNEL" = "stable" ]; then echo "BUNDLES=nsis,msi" >> "$GITHUB_ENV"; else echo "BUNDLES=nsis" >> "$GITHUB_ENV"; fi
          node -e "
            const fs = require('fs'); const p = 'src-tauri/tauri.conf.json'; const c = JSON.parse(fs.readFileSync(p));
            c.version = process.env.VERSION;
            if (process.env.PUBLISH === 'true' && process.env.HAS_KEY === 'true') c.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));"
          echo "Building SocialEye $VERSION ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Signing key configured?
        if: env.PUBLISH == 'true' && env.HAS_KEY != 'true'
        shell: bash
        run: |
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret or SOCIALEYE_UPDATER_PUBKEY variable is missing: this build is NOT published as an update (fail closed)."
          echo "### Update not published: configure the update signing key (docs/UPDATES.md)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and publish signed release
        if: env.PUBLISH == 'true' && env.HAS_KEY == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: SocialEye ${{ env.VERSION }}
          releaseBody: |
            ${{ env.CHANNEL == 'stable' && 'Stable release. See CHANGELOG.md.' || format('Testing build from {0} at {1}. Installed automatically only by users on the Testing channel, after they confirm.', github.ref_name, github.sha) }}

            Installers are signed for the in-app updater; they are not Authenticode-signed, so Windows SmartScreen may warn on a manual install.
          releaseDraft: false
          prerelease: ${{ env.CHANNEL == 'testing' }}
          includeUpdaterJson: true
          args: --bundles ${{ env.BUNDLES }}
      - name: Build installers (not published)
        if: env.PUBLISH != 'true' || env.HAS_KEY != 'true'
        run: npx tauri build --bundles ${{ env.BUNDLES }}
      - uses: actions/upload-artifact@v4
        with:
          name: SocialEye-${{ env.VERSION }}-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
